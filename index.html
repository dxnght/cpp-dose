<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Content-Security-Policy — Constitution Art. V (offline / zero exfiltration).
      connect-src 'self' forbids any outbound request (fetch/XHR/WebSocket/beacon)
      to a foreign origin. No analytics, no CDN, no runtime network.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CPP-DOSE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
